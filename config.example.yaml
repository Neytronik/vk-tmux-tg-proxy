# ═══════════════════════════════════════════════════════════════
#  VK ↔ Telegram Proxy Bot — пример конфигурации
# ═══════════════════════════════════════════════════════════════
#
#  1. Скопируйте этот файл:
#       mkdir -p ~/.vk-tmux-bot
#       cp config.example.yaml ~/.vk-tmux-bot/config.yaml
#  2. Заполните значения ниже (как минимум секции vk и telegram).
#  3. Запустите: python3 run.py start
#
#  Подробная инструкция — в README.md.
# ═══════════════════════════════════════════════════════════════

vk:
  # Токен сообщества ВК (Управление → Работа с API → Создать ключ,
  # права: «Сообщения сообщества»).
  group_token: "ВСТАВЬТЕ_ТОКЕН_СООБЩЕСТВА"

  # ID сообщества (число из адреса vk.com/club<ID>).
  group_id: 0

  # Кто может управлять сервером (tmux/Claude) и админкой.
  # Обычно только вы. Если оставить пустым — админом станет
  # первый из allowed_user_ids.
  admin_ids:
    - 123456789        # ← ваш VK ID (узнать: https://regvk.com/id/)

  # Кому вообще разрешён бот (Telegram-прокси).
  # Админ добавляется сюда автоматически. Остальным — только Telegram.
  allowed_user_ids:
    - 123456789        # ← ваш VK ID
    # - 987654321      # ← можно добавить жену/друга (или из бота: /adduser)

telegram:
  # api_id и api_hash — с https://my.telegram.org → API development tools.
  # Если сайт недоступен, можно использовать публичные значения
  # Telegram Desktop (только для личного пользования):
  #   api_id: 17349
  #   api_hash: "344583e45741c457fe1862106095a5eb"
  api_id: 0
  api_hash: ""

  # Префикс файлов сессий Telethon. Для каждого пользователя/аккаунта
  # создаётся свой файл (…_<vk_id>[_<аккаунт>].session).
  session_file: "~/.vk-tmux-bot/tg_session"

tmux:
  output_lines: 60          # сколько строк вывода показывать
  watch_interval: 2.0       # период автообновления вывода, сек
  work_dir: "~"             # рабочая директория новых сессий
  idle_notify_minutes: 10   # тишина N минут → уведомление «сессия остановилась»
                            # (удобно для Claude: закончил задачу/петлю)

claude:
  command: "claude"             # команда запуска Claude Code (кнопка «🤖 Claude»)
  deepclaude_command: "dcc"     # команда для кнопки «🧠 DeepClaude»

bot:
  rate_limit_delay: 0.4     # пауза между сообщениями ВК, сек (защита от лимитов)
  long_poll_wait: 25        # таймаут Long Poll, сек
